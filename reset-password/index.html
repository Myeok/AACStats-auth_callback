<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ArcheAge Classic</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f1c;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.03) 0%, transparent 50%);
        }

        .card {
            background: linear-gradient(145deg, #111827, #1f2937);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            width: calc(100% - 40px);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8),
                        0 0 30px rgba(245, 158, 11, 0.1);
            margin: 20px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            border-radius: 20px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #f59e0b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            margin-bottom: 32px;
        }

        .reset-icon {
            width: 64px;
            height: 64px;
            background: rgba(245, 158, 11, 0.1);
            border: 2px solid rgba(245, 158, 11, 0.3);
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #f59e0b;
            animation: scaleIn 0.5s ease-out;
        }

        h2 {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: #f3f4f6;
            margin-bottom: 16px;
        }

        p {
            color: #9ca3af;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #d1d5db;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(10, 15, 28, 0.8);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 12px;
            color: #f3f4f6;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: rgba(245, 158, 11, 0.7);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
        }

        input::placeholder {
            color: #6b7280;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px 32px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0a0f1c;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            border: 2px solid rgba(251, 191, 36, 0.3);
            cursor: pointer;
            margin-top: 8px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            min-height: 22px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.5;
            color: #9ca3af;
        }

        .message.success {
            color: #10b981;
        }

        .message.error {
            color: #f87171;
        }

        .message.warning {
            color: #f59e0b;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #4b5563;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="../logo.png" alt="ArcheAge Classic" width="40" height="40" style="display: block;">
        </div>

        <h1>ARCHEAGE <span style="color: #f59e0b;">CLASSIC</span></h1>
        <div class="subtitle">Statistics Tracker</div>

        <div class="reset-icon">&#8635;</div>

        <h2>Reset Password</h2>
        <p>Enter a new password for your account. After updating it, you can return to the application and sign in.</p>

        <form id="resetForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input
                    id="password"
                    type="password"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm new password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button id="resetButton" type="submit" class="btn">Update Password</button>
        </form>

        <div id="message" class="message">Checking recovery session...</div>

        <div class="footer">
            You may close this window after your password has been updated.
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

        const SUPABASE_URL = 'https://jtvbxaknqchseoeimjht.supabase.co'

        const SUPABASE_ANON_KEY = 'sb_publishable_wH69UkO-HWmtZ5gDz-KMjQ_VxaF0J_x'

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        const form = document.getElementById('resetForm')
        const passwordInput = document.getElementById('password')
        const confirmPasswordInput = document.getElementById('confirmPassword')
        const resetButton = document.getElementById('resetButton')
        const message = document.getElementById('message')

        function setMessage(text, type = '') {
            message.textContent = text
            message.className = `message ${type}`
        }

        function setLoading(isLoading) {
            resetButton.disabled = isLoading
            resetButton.textContent = isLoading ? 'Updating...' : 'Update Password'
        }

        function getHashParams() {
            const hash = window.location.hash.startsWith('#')
                ? window.location.hash.substring(1)
                : window.location.hash

            return new URLSearchParams(hash)
        }

        async function initializeRecoverySession() {
            const url = new URL(window.location.href)
            const hashParams = getHashParams()

            const error = url.searchParams.get('error') || hashParams.get('error')
            const errorDescription = url.searchParams.get('error_description') || hashParams.get('error_description')

            if (error) {
                setMessage(errorDescription || 'This recovery link is invalid or has expired.', 'error')
                return
            }

         
            const accessToken = hashParams.get('access_token')
            const refreshToken = hashParams.get('refresh_token')

            if (accessToken && refreshToken) {
                const { error: sessionError } = await supabase.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken
                })

                if (sessionError) {
                    setMessage(sessionError.message, 'error')
                    return
                }

                setMessage('Recovery link verified. Enter your new password.', 'success')
                return
            }

            
            const { data, error: sessionError } = await supabase.auth.getSession()

            if (sessionError) {
                setMessage(sessionError.message, 'error')
                return
            }

            if (data.session) {
                setMessage('Recovery session detected. Enter your new password.', 'success')
                return
            }

          
            setMessage('No recovery session was found. Please open this page from the password reset email.', 'warning')
        }

        supabase.auth.onAuthStateChange((event) => {
            if (event === 'PASSWORD_RECOVERY') {
                setMessage('Recovery link verified. Enter your new password.', 'success')
            }
        })

        form.addEventListener('submit', async (event) => {
            event.preventDefault()

            const password = passwordInput.value.trim()
            const confirmPassword = confirmPasswordInput.value.trim()

            if (!password || !confirmPassword) {
                setMessage('Please enter and confirm your new password.', 'error')
                return
            }

            if (password !== confirmPassword) {
                setMessage('Passwords do not match.', 'error')
                return
            }

            if (password.length < 6) {
                setMessage('Password must be at least 6 characters.', 'error')
                return
            }

            setLoading(true)
            setMessage('Updating password...')

            const { error } = await supabase.auth.updateUser({
                password
            })

            if (error) {
                setLoading(false)
                setMessage(error.message, 'error')
                return
            }

            setMessage('Password updated successfully. You can now sign in with your new password.', 'success')

            await supabase.auth.signOut()

            setTimeout(() => {
                if (window.opener) {
                    window.close()
                }
            }, 3000)
        })

        initializeRecoverySession()
    </script>
</body>
</html>
